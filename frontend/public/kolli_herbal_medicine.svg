<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="mistGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Forest & Mountain Mist -->
  <rect width="1280" height="720" fill="url(#bgHills)" />
  
  <!-- Layered Hills Silhouette -->
  <path d="M 0 380 Q 280 200 620 320 T 1280 260 L 1280 720 L 0 720 Z" fill="#065F46" opacity="0.6" />
  <path d="M 0 460 Q 380 320 820 420 T 1280 390 L 1280 720 L 0 720 Z" fill="#047857" opacity="0.8" />
  
  <!-- Misty Glow Layers -->
  <ellipse cx="640" cy="320" rx="500" ry="140" fill="url(#mistGlow)" />

  <!-- Traditional Stone Mortar and Pestle (கல் உரலும் குழவியும்) -->
  <g transform="translate(420, 260)">
    <!-- Mortar Base -->
    <path d="M 90 260 C 90 340 350 340 350 260 L 320 180 C 320 160 120 160 120 180 Z" fill="url(#stoneGrad)" stroke="#6EE7B7" stroke-width="4" />
    <ellipse cx="220" cy="180" rx="100" ry="32" fill="#111827" stroke="#34D399" stroke-width="3" />
    
    <!-- Crushed Herbal Paste inside Mortar -->
    <ellipse cx="220" cy="184" rx="75" ry="22" fill="#047857" />

    <!-- Stone Pestle (குழவி) leaning at angle -->
    <g transform="rotate(-24, 220, 180)">
      <rect x="200" y="30" width="48" height="190" rx="24" fill="url(#stoneGrad)" stroke="#A7F3D0" stroke-width="3" />
      <ellipse cx="224" cy="210" rx="24" ry="12" fill="#1F2937" />
    </g>
  </g>

  <!-- Siddha Medicinal Herbs / Leaves -->
  <!-- Left Leaf Sprig (Adathodai) -->
  <g transform="translate(240, 320)">
    <path d="M 120 220 Q 80 120 20 100 Q 80 80 120 220" fill="url(#leafGrad)" stroke="#A7F3D0" stroke-width="3" />
    <path d="M 120 220 Q 140 100 80 40 Q 60 100 120 220" fill="url(#leafGrad)" stroke="#A7F3D0" stroke-width="3" />
    <path d="M 120 220 Q 180 130 220 110 Q 160 90 120 220" fill="url(#leafGrad)" stroke="#A7F3D0" stroke-width="3" />
    <line x1="120" y1="220" x2="80" y2="40" stroke="#064E3B" stroke-width="3" />
  </g>

  <!-- Right Leaf Sprig & Seeds (Mudakathan) -->
  <g transform="translate(860, 310)">
    <path d="M 40 220 Q 80 130 160 110 Q 90 90 40 220" fill="url(#leafGrad)" stroke="#A7F3D0" stroke-width="3" />
    <path d="M 40 220 Q 20 110 90 50 Q 110 110 40 220" fill="url(#leafGrad)" stroke="#A7F3D0" stroke-width="3" />
    <circle cx="160" cy="110" r="14" fill="#F59E0B" opacity="0.9" />
    <circle cx="185" cy="130" r="11" fill="#F59E0B" opacity="0.9" />
  </g>

  <!-- Title Banner Card in Pure Tamil -->
  <rect x="340" y="630" width="600" height="60" rx="16" fill="#022C22" fill-opacity="0.88" stroke="#34D399" stroke-width="2" />
  <text x="640" y="668" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#A7F3D0" text-anchor="middle" letter-spacing="1">
    கொல்லிமலை மூலிகை மருத்துவம் • சித்த மரபு (Namakkal)
  </text>
</svg>
