<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVillu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="50%" stop-color="#243B55" />
      <stop offset="100%" stop-color="#1B1212" />
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldBow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bellGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgVillu)" />
  <circle cx="640" cy="380" r="340" fill="url(#stageGlow)" />

  <!-- Temple Pillars Silhouette in Background -->
  <g opacity="0.18" fill="#FDE68A">
    <rect x="120" y="100" width="45" height="520" rx="6" />
    <rect x="100" y="80" width="85" height="30" rx="4" />
    <rect x="1115" y="100" width="45" height="520" rx="6" />
    <rect x="1095" y="80" width="85" height="30" rx="4" />
    <path d="M 120 180 Q 640 100 1160 180" stroke="#FDE68A" stroke-width="8" fill="none" />
  </g>

  <!-- The Great Musical Bow (Villu) -->
  <g transform="translate(0, 40)" filter="url(#glow)">
    <!-- Bow Arc -->
    <path d="M 220 540 Q 640 120 1060 540" fill="none" stroke="url(#goldBow)" stroke-width="26" stroke-linecap="round" />
    <path d="M 230 535 Q 640 135 1050 535" fill="none" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    
    <!-- Bow String (Taut) -->
    <line x1="220" y1="540" x2="1060" y2="540" stroke="#FBBF24" stroke-width="7" />
    <line x1="220" y1="540" x2="1060" y2="540" stroke="#FFF" stroke-width="2" opacity="0.7" />

    <!-- Bronze Hanging Bells (Kinkini) -->
    <g>
      <!-- Bell 1 -->
      <line x1="360" y1="410" x2="360" y2="460" stroke="#F59E0B" stroke-width="3" />
      <circle cx="360" cy="470" r="14" fill="url(#bellGold)" />
      <circle cx="360" cy="484" r="5" fill="#78350F" />
      
      <!-- Bell 2 -->
      <line x1="480" y1="290" x2="480" y2="350" stroke="#F59E0B" stroke-width="3" />
      <circle cx="480" cy="365" r="18" fill="url(#bellGold)" />
      <circle cx="480" cy="383" r="6" fill="#78350F" />

      <!-- Center Apex Bell 3 -->
      <line x1="640" y1="225" x2="640" y2="295" stroke="#F59E0B" stroke-width="4" />
      <circle cx="640" cy="315" r="24" fill="url(#bellGold)" />
      <circle cx="640" cy="339" r="8" fill="#78350F" />

      <!-- Bell 4 -->
      <line x1="800" y1="290" x2="800" y2="350" stroke="#F59E0B" stroke-width="3" />
      <circle cx="800" cy="365" r="18" fill="url(#bellGold)" />
      <circle cx="800" cy="383" r="6" fill="#78350F" />

      <!-- Bell 5 -->
      <line x1="920" y1="410" x2="920" y2="460" stroke="#F59E0B" stroke-width="3" />
      <circle cx="920" cy="470" r="14" fill="url(#bellGold)" />
      <circle cx="920" cy="484" r="5" fill="#78350F" />
    </g>

    <!-- Striking Rods (Veesukol) -->
    <path d="M 520 480 L 760 380" stroke="#FDE68A" stroke-width="12" stroke-linecap="round" />
    <path d="M 530 475 L 750 385" stroke="#D97706" stroke-width="4" />
    
    <!-- Udukkai Drum (Left) -->
    <g transform="translate(180, 440)">
      <path d="M 0 0 C 40 40 40 80 0 120 L 70 120 C 30 80 30 40 70 0 Z" fill="#B45309" stroke="#FDE68A" stroke-width="3" />
      <line x1="0" y1="0" x2="70" y2="120" stroke="#F59E0B" stroke-width="2" />
      <line x1="0" y1="120" x2="70" y2="0" stroke="#F59E0B" stroke-width="2" />
      <circle cx="35" cy="60" r="10" fill="#78350F" />
    </g>

    <!-- Clay Pot Resonator (Kudam) (Center Right) -->
    <g transform="translate(680, 480)">
      <ellipse cx="60" cy="50" rx="55" ry="45" fill="#78350F" stroke="#F59E0B" stroke-width="3" />
      <ellipse cx="60" cy="10" rx="30" ry="10" fill="#92400E" stroke="#FDE68A" stroke-width="2" />
      <path d="M 15 50 Q 60 70 105 50" stroke="#FDE68A" stroke-width="2" fill="none" opacity="0.6" />
    </g>
  </g>

  <!-- Title Banner Card in Pure Tamil -->
  <rect x="340" y="630" width="600" height="60" rx="16" fill="#0F172A" fill-opacity="0.85" stroke="#F59E0B" stroke-width="2" />
  <text x="640" y="668" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#FDE68A" text-anchor="middle" letter-spacing="1">
    வில்லுப்பாட்டு • வாய்மொழி காவிய மரபு (Tirunelveli)
  </text>
</svg>
